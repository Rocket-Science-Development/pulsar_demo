[tool.poetry]
name = "pulsar-demo"
version = "0.1.0"
description = "Démonstration de bout en bout de Pulsar : collecte, métriques, tableaux de bord et banc de tests."
authors = ["Développement Science Fusée inc. <mlops@rocketscience.one>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "pulsar_demo"}]

[tool.poetry.dependencies]
python = "3.9.6"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.22.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
