apiVersion: 1

datasources:
- name: MYINFLUXDB
  type: influxdb
  access: proxy
  url: http://influxdb:8086
  password: ${DB_PASSWORD}
  user: ${DB_USER}
  database: PULSAR_DATA_COLLECTION
  basicAuth: false
  basicAuthUser:
  basicAuthPassword:
  withCredentials:
  isDefault: true
  jsonData:
     tlsAuth: false
     tlsAuthWithCACert: false
  secureJsonData:
    tlsCACert: ""
    tlsClientCert: ""
    tlsClientKey: ""
  version: 1
  editable: true