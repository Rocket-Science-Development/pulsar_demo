services:
  influxdb:
    image: "influxdb:2.6.1"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }  # many concurrent writers (lab SC-01)
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: change-me-demo-only
      DOCKER_INFLUXDB_INIT_ORG: pulsarml
      DOCKER_INFLUXDB_INIT_BUCKET: monitoring
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: demo-token-change-me
    volumes:
      - influxdb-data:/var/lib/influxdb2
  ollama:
    image: "ollama/ollama:0.6.8"
    environment:
      # Decoding slots. Left unset, Ollama picks 4 or 1 from the free memory, and with 1 slot the agent stays near
      # 50 runs/min whatever the number of workers (lab SC-10). 4 is the latency-bounded setting measured on a T4 with
      # a 4096 context, 16 the throughput one (README, "Concurrency"). Run the agent with as many workers as slots.
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_MAX_LOADED_MODELS: "1"  # one model in VRAM: the KV cache of every slot comes on top of its weights
      OLLAMA_CONTEXT_LENGTH: "4096"  # per slot; the values of the README were measured at this context
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
volumes:
  influxdb-data:
  ollama-models:
