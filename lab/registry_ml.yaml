# Pulsar.ml lab — classical ML families. Datasets verified on their source pages (2026-11-01/02); licences as stated
# there ("unverified" when the page states none). Downloads stay outside the repositories (lab/data/, gitignored).

family: ml
tests:
  # ------------------------------------------------------------------ time series / streaming
  - id: TS-01
    title: Seasonal electricity load — A/A calibration across seasons
    capability: KS, Wasserstein, PSI on windows; AACalibrator; BH; DriftPersistence
    dataset: {name: UCI ElectricityLoadDiagrams20112014, url: "https://archive.ics.uci.edu/dataset/321", licence: CC BY 4.0, size: 249 MB}
    method: >-
      370 clients, 15-min steps, 2011-2014. Reference = a month; compare same-season months (should be quiet after
      calibration) and opposite seasons (should alert); clients joining late give natural onsets.
    pass: false alarm rate on same-season windows <= 5 % after A/A; opposite seasons confirmed within 2 windows
    expected_limit: strong seasonality — a single static reference may alert all summer; seasonal references needed
    env: aws-cpu
    duration_min: 40
  - id: TS-02
    title: Documented sensor drift (air quality)
    capability: feature drift, regression performance decay with delayed labels
    dataset: {name: UCI Air Quality, url: "https://archive.ics.uci.edu/dataset/360", licence: CC BY 4.0, size: 1.5 MB}
    method: Hourly gas sensors Mar 2004 - Feb 2005 with documented drift; regression of reference analyser values; missing = -200.
    pass: drift confirmed on drifting sensors; RMSE degradation flagged; -200 handled (not a value)
    expected_limit: sentinel missing values (-200) may be treated as data and trigger drift
    env: aws-cpu
    duration_min: 15
  - id: TS-03
    title: Labelled anomaly windows (NAB) — alerting precision/recall
    capability: drift on streams vs ground-truth windows; detection delay
    dataset: {name: Numenta Anomaly Benchmark, url: "https://github.com/numenta/NAB", licence: repo MIT, data unverified, size: 58 series}
    method: Rolling windows on each series; count alerts inside / outside labelled anomaly windows.
    pass: precision, recall and median delay reported per series family; no crash on short series
    expected_limit: distribution-drift tests are not point-anomaly detectors — low recall on single spikes expected
    env: aws-cpu
    duration_min: 20
  - id: TS-04
    title: Year-on-year growth (bike sharing)
    capability: drift vs trend; delayed-label regression monitoring
    dataset: {name: UCI Bike Sharing, url: "https://archive.ics.uci.edu/dataset/275", licence: CC BY 4.0, size: 273 KB}
    method: Model trained on 2011, monitored through 2012 (growth + seasons); labels delayed 48 h.
    pass: growth detected as drift on cnt and performance; seasonal confounding documented
    env: aws-cpu
    duration_min: 15
  # ------------------------------------------------------------------ tabular classification
  - id: TC-01
    title: Concept drift on ELEC2
    capability: concept drift (P(y|x) changes), performance monitoring, persistence
    dataset: {name: Electricity (ELEC2), url: "https://www.openml.org/d/151", licence: public (OpenML), size: 45k rows}
    method: Train on first months, stream the rest in weekly windows; compare feature drift alerts with accuracy decay.
    pass: accuracy decay detected; documented cases where features are stable but the concept moves (performance-only alert)
    expected_limit: feature drift tests cannot see pure concept drift — only performance with labels can
    env: aws-cpu
    duration_min: 20
  - id: TC-02
    title: Large stream with high-cardinality categoricals (airlines)
    capability: chi2 on high cardinality, analysis cost on 500k rows
    dataset: {name: Airlines, url: "https://www.openml.org/d/1169", licence: public (OpenML), size: 539k rows}
    method: Time-ordered flights; airports and carriers as categoricals (hundreds of levels).
    pass: no crash; sparse categories handled; runtime per window recorded
    expected_limit: chi2 with hundreds of sparse levels — low expected counts, unstable p-values; need level grouping
    env: aws-cpu
    duration_min: 25
  - id: TC-03
    title: Injected covariate shift and explanation drift (Covertype)
    capability: injected shift by elevation / wilderness area; TreeSHAP AttributionDrift; importance by group
    dataset: {name: Covertype, url: "https://archive.ics.uci.edu/dataset/31", licence: CC BY 4.0, size: 581k x 54}
    method: Dose-response — mix 0 to 100 % of rows from another wilderness area; gradient boosting model.
    pass: drift power curve by mix share; explanation shares move with the shift; no alert at 0 %
    env: aws-cpu
    duration_min: 40
  - id: TC-04
    title: Natural temporal drift across the 2008 crisis (bank marketing)
    capability: chi2 / PSI on categoricals; performance decay
    dataset: {name: Bank Marketing (full, date-ordered), url: "https://archive.ics.uci.edu/dataset/222", licence: CC BY 4.0, size: 45k rows}
    method: Rows in date order May 2008 - Nov 2010 (order inferred from the file); monthly windows.
    pass: drift around the crisis confirmed; macro features (euribor, employment) lead
    env: aws-cpu
    duration_min: 15
  - id: TC-05
    title: Ground-truth drift points (INSECTS) — detection delay
    capability: abrupt, gradual, incremental and recurring drift; delay and false alarms
    dataset: {name: INSECTS (Souza et al. 2020), url: "https://sites.google.com/view/uspdsrepository", licence: unverified, size: varies}
    method: Known drift points; measure delay to raw and confirmed alert per drift type.
    pass: abrupt drift confirmed within 2 windows; gradual drift delay documented; recurring drift re-alerts
    expected_limit: persistence of 2 windows delays gradual drift; recurring drift needs reference updates
    env: aws-cpu
    duration_min: 30
    note: licence unverified — internal test only, checksum pinned, not redistributed
  # ------------------------------------------------------------------ tabular regression
  - id: TR-01
    title: Regional shift in house prices
    capability: regression performance, SHAP drift
    dataset: {name: California Housing (sklearn), url: "https://scikit-learn.org/stable/datasets/real_world.html", licence: unverified, size: 20k x 8}
    method: Train on the south, monitor a growing share of northern districts.
    pass: RMSE decay and drift confirmed; latitude/longitude importance shift visible
    env: aws-cpu
    duration_min: 10
  - id: TR-02
    title: Monthly NYC taxi fares — volume, breaks and schema change
    capability: large-scale drift, COVID break, schema change (column added in 2025)
    dataset: {name: NYC TLC yellow trips, url: "https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page", licence: unverified, size: ~100 MB/month}
    method: Pinned months 2019-01..2020-06 and 2024-12..2025-03; fare regression; one Pulse per month.
    pass: COVID break confirmed; the new column is handled without crash (writer groups columns)
    expected_limit: tens of millions of rows per analysis window — needs sampling or incremental statistics
    env: aws-scale
    duration_min: 60
  # ------------------------------------------------------------------ text and images (embedding drift)
  - id: TX-01
    title: Topic shift in English news (AG News)
    capability: MMD on embeddings (nomic-embed-text)
    dataset: {name: AG News, url: "https://huggingface.co/datasets/fancyzhx/ag_news", licence: unknown, size: 127k}
    method: Change the class mix 0-100 % (Sports -> Sci/Tech); windows of 100/300/1000 texts.
    pass: power curve by mix share and window; level <= 5 % at 0 %
    env: aws-gpu
    duration_min: 25
  - id: TX-02
    title: French reviews — polarity and language shift (Allociné)
    capability: MMD in French; FR/EN language shift; PII rules on free text
    dataset: {name: Allociné, url: "https://huggingface.co/datasets/tblard/allocine", licence: MIT, size: 200k}
    method: Polarity mix shift; then Allociné vs AG News (language shift); run PiiPolicy on review text.
    pass: polarity shift detected at >= 30 %; language shift detected at 5 %; PII findings logged, never stored
    env: aws-gpu
    duration_min: 25
  - id: IM-01
    title: Graded image corruptions (CIFAR-10-C)
    capability: MMD on image embeddings (open encoder), dose-response by severity
    dataset: {name: CIFAR-10 + CIFAR-10-C, url: "https://zenodo.org/records/2535967", licence: CC BY 4.0 (C); CIFAR-10 unstated, size: 3.1 GB}
    method: Encoder embeddings; severity 1-5 for 5 corruption types; windows of 200 images.
    pass: detection rises with severity; level <= 5 % on clean vs clean
    expected_limit: no image encoder ships with Pulsar — the embedding step is the user's
    env: aws-gpu
    duration_min: 40
  - id: IM-02
    title: Cheap image drift (MNIST-C)
    capability: same as IM-01, fast run
    dataset: {name: MNIST + MNIST-C, url: "https://zenodo.org/records/3239543", licence: MIT / CC BY 4.0, size: 265 MB}
    method: 15 corruption types vs clean.
    pass: each corruption detected or explained
    env: aws-cpu
    duration_min: 15
  # ------------------------------------------------------------------ fairness
  - id: FA-01
    title: Fairness across states and years (Folktables)
    capability: FairnessAnalyzer (DIR, parity, equal opportunity, intersections), FairnessMonitor across years
    dataset: {name: Folktables ACSIncome / ACSEmployment, url: "https://github.com/socialfoundations/folktables", licence: code MIT; Census terms (no re-identification), size: per state/year}
    method: 10 states x 2014-2018; model trained on CA 2014, monitored elsewhere; sequential monitor year after year.
    pass: verdicts with intervals per state; Fairlearn agreement; no false sequential alarm where gaps are stable
    expected_limit: intersections explode with many groups — suppression and simultaneous intervals cost
    env: aws-cpu
    duration_min: 45
    note: data kept outside repositories; attribution "not endorsed or certified by the Census Bureau"
  - id: FA-02
    title: Fairness on clinical readmissions (optional, sensitive)
    capability: fairness on de-identified clinical data; small groups
    dataset: {name: Diabetes 130-US Hospitals, url: "https://archive.ics.uci.edu/dataset/296", licence: CC BY 4.0, size: 101k x 47}
    method: Readmission model; race, gender, age groups; small-cell suppression.
    pass: suppression of groups < 30; verdicts with intervals
    env: aws-cpu
    duration_min: 15
    note: real de-identified health records — optional, outside repositories, approve explicitly
  - id: FA-03
    title: Aggregate-level fairness (communities and crime)
    capability: fairness when only aggregates exist
    dataset: {name: Communities and Crime, url: "https://archive.ics.uci.edu/dataset/183", licence: CC BY 4.0, size: 2k x 128}
    method: Groups from race-share terciles.
    pass: behaviour documented; limitation of aggregate attributes stated
    expected_limit: Pulsar fairness assumes individual protected attributes
    env: aws-cpu
    duration_min: 10
  - id: FA-04
    title: Bias-injection power curves (synthetic, reference)
    capability: all fairness modules with known truth
    dataset: {name: semi-synthetic eligibility (pulsar_demo/ethics_validation), url: "repo", licence: Apache 2.0, size: generated}
    method: Rerun E5 power curves at 1,000 simulations per cell (overnight scale).
    pass: false alarms <= 5 %; power curves within E5 intervals
    env: aws-cpu
    duration_min: 60
